<title>The House — Collection (house as living background, products over it)</title>
<style>
  :root {
    --ground:      #0E0708;
    --wall:        #4A2B24;
    --wall-lit:    #6B3D31;
    --floor:       #3E241A;
    --brass:       #E8B849;
    --brass-lit:   #FCD46F;
    --brass-deep:  #A67816;
    --parchment:   #EFDDB2;
    --parchment-2: #E4CF9A;
    --ink:         #2A1810;
    --ink-med:     #5C4028;
    --ink-mut:     #8B6E4A;
    --silk:        #F7ECD4;
    --silk-muted:  rgba(247, 236, 212, 0.72);
    --silk-faint:  rgba(247, 236, 212, 0.5);
    --marigold:    #F0A040;
    --sindoor:     #C6202A;
    --tulsi:       #6B8E5B;
    --f-display:   "Baskerville", "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    --f-body:      "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
    --ease:        cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--silk);
    font-family: var(--f-body);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    /* Full-page scroll is the only scroll — no nested containers. */
    min-height: 100vh;
  }

  /* ================================================================
     THE HOUSE — position: fixed, full viewport, ALIVE THROUGHOUT
     ================================================================ */
  .house-fixed {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(80% 60% at 50% 30%, rgba(74, 43, 36, 0.55) 0%, rgba(20, 12, 14, 0.0) 65%),
      linear-gradient(180deg, #1A0E10 0%, #14090A 55%, #0A0506 100%);
  }
  .house-fixed__grain {
    position: absolute; inset: 0;
    opacity: 0.10; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.8 0 0 0 0 0.6 0 0 0 0.65 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .house-stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 92vw; max-width: 1500px;
    height: 66vh; max-height: 720px;
    perspective: 1400px;
    perspective-origin: 50% 40%;
    opacity: 0.72;
  }
  .house {
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transform-origin: center center;
    transition: transform 900ms var(--ease);
  }
  .house svg { width: 100%; height: 100%; display: block; }

  /* SVG house internal styles */
  .rm-wall { fill: var(--wall); }
  .rm-divider { stroke: rgba(10,6,6,0.7); stroke-width: 1; fill: none; }
  .rm-outline { stroke: rgba(232,184,73,0.35); stroke-width: 1.4; fill: none; }
  /* Plaques hidden — labels now use paint-order text-stroke for readability
     without a boxy tag intruding into the room composition. */
  .rm-plaque { display: none; }
  /* paint-order: stroke fill draws a dark outline UNDER each glyph, so the
     text reads on ANY wall texture without a rectangular backdrop. */
  .rm-label {
    font-family: var(--f-body); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 500;
    fill: rgba(247, 236, 212, 0.92);
    stroke: rgba(10, 5, 5, 0.95);
    stroke-width: 2;
    stroke-linejoin: round;
    paint-order: stroke fill;
    text-anchor: middle;
    transition: fill 500ms var(--ease);
  }
  .rm-label__dev {
    font-family: var(--f-display); font-style: italic; font-size: 11px;
    fill: rgba(252, 212, 111, 0.95);
    stroke: rgba(10, 5, 5, 0.95);
    stroke-width: 2;
    stroke-linejoin: round;
    paint-order: stroke fill;
    text-anchor: middle;
    transition: fill 500ms var(--ease);
  }
  .rm-highlight { fill: rgba(255, 200, 130, 0); transition: fill 700ms var(--ease); }
  .rm-dim { fill: rgba(0, 0, 0, 0); transition: fill 700ms var(--ease); }
  body.active .rm-dim { fill: rgba(0, 0, 0, 0.55); }
  .room-group.active-room .rm-dim { fill: rgba(0,0,0,0) !important; }
  .room-group.active-room .rm-highlight { fill: var(--room-glow, rgba(255, 200, 130, 0.15)); }
  .room-group.active-room .rm-label { fill: var(--silk); }
  .room-group.active-room .rm-label__dev { fill: var(--brass-lit); }
  .prod-icon {
    fill: rgba(232, 184, 73, 0.7);
    stroke: rgba(252, 212, 111, 0.9);
    stroke-width: 0.8;
    transition: all 500ms var(--ease);
  }
  .room-group.active-room .prod-icon {
    fill: rgba(252, 212, 111, 1);
    stroke: rgba(255, 240, 200, 1);
    filter: drop-shadow(0 0 6px rgba(252, 212, 111, 0.8));
  }
  /* Ambient life — reduced to only what's ORGANIC in a real home:
     Diya flame flickers gently. Sky in courtyard breathes very slowly.
     Curtains and tulsi shift barely-there. Wind chime and garland now
     STATIC — the previous animations felt like a jittery diorama, not a
     lived-in space. This is the tempo of a room at dusk. */
  @keyframes flick {
    0%,100% { transform: scale(1,1); filter: brightness(1); }
    50% { transform: scale(1.02, 0.98); filter: brightness(1.06); }
  }
  .diya-flame { transform-origin: 50% 100%; animation: flick 3.8s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  .tulsi { transform-origin: 50% 100%; animation: sway 8s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1px); } }
  .curtain-l { animation: wave 7s ease-in-out infinite; }
  .curtain-r { animation: wave 7s ease-in-out infinite reverse; }
  /* Wind chime and marigold garland — no longer animated, they now
     read as CRAFT DETAIL not moving noise. */
  .chime, .garland { /* static */ }
  @keyframes sky-breath { 0%,100% { opacity: 0.82; } 50% { opacity: 0.92; } }
  .sky { animation: sky-breath 18s ease-in-out infinite; }

  /* ================================================================
     STICKY HEADER + FILTER — semi-transparent so house shows through
     ================================================================ */
  .sa-header {
    position: sticky; top: 0;
    z-index: 30;
    background: linear-gradient(180deg, rgba(14, 7, 8, 0.88) 0%, rgba(14, 7, 8, 0.7) 100%);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(232, 184, 73, 0.14);
  }
  .sa-header__inner {
    max-width: 1360px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    font-family: var(--f-display); font-size: 20px; color: var(--silk);
  }
  .brand em { font-style: italic; color: var(--brass-lit); }
  .sa-nav {
    display: flex; align-items: center; gap: 22px;
    font-size: 13px;
  }
  .sa-nav a { color: var(--silk-muted); text-decoration: none; transition: color 200ms; }
  .sa-nav a:hover { color: var(--silk); }
  .sa-nav__icons { display: flex; align-items: center; gap: 18px; }
  .sa-icon-btn {
    background: none; border: 0; padding: 4px 8px;
    color: var(--silk-muted); cursor: pointer;
    font-size: 13px; display: flex; align-items: center; gap: 6px;
    font-family: var(--f-body);
    transition: color 200ms;
  }
  .sa-icon-btn:hover { color: var(--silk); }
  .sa-icon-btn b { color: var(--brass-lit); font-weight: 500; font-size: 12px; }

  .sa-filter {
    position: sticky; top: 62px;
    z-index: 25;
    background: linear-gradient(180deg, rgba(14, 7, 8, 0.75) 0%, rgba(14, 7, 8, 0.5) 100%);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(232, 184, 73, 0.10);
  }
  .sa-filter__inner {
    max-width: 1360px; margin: 0 auto;
    padding: 12px 32px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
  }
  .sa-filter__count {
    font-size: 12px; letter-spacing: 0.06em; color: var(--silk-muted);
  }
  .sa-filter__count b { color: var(--silk); font-weight: 500; }
  .chips { display: flex; gap: 8px; }
  .chip {
    padding: 7px 15px; border-radius: 18px;
    font-size: 12px; letter-spacing: 0.03em;
    color: var(--silk-muted);
    background: rgba(30, 20, 22, 0.55);
    border: 1px solid rgba(232, 184, 73, 0.18);
    cursor: pointer;
    transition: all 260ms var(--ease);
    font-family: var(--f-body);
  }
  .chip:hover { background: rgba(232, 184, 73, 0.14); color: var(--silk); }
  .chip.on {
    background: rgba(232, 184, 73, 0.24);
    color: var(--brass-lit);
    border-color: rgba(252, 212, 111, 0.55);
  }
  .sa-filter__sort {
    font-size: 12px; letter-spacing: 0.04em;
    color: var(--silk-muted);
    background: transparent;
    border: 1px solid rgba(232, 184, 73, 0.2);
    border-radius: 5px;
    padding: 6px 12px;
    cursor: pointer;
    font-family: var(--f-body);
  }

  /* ================================================================
     PAGE INTRO + PRODUCT GRID — flows over the fixed house
     ================================================================ */
  .page-intro {
    position: relative; z-index: 2;
    max-width: 1360px; margin: 0 auto;
    padding: 42px 32px 24px;
    text-align: center;
    pointer-events: none;
  }
  .page-intro__eyebrow {
    font-size: 10.5px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 6px;
  }
  .page-intro__title {
    font-family: var(--f-display); font-weight: 400;
    font-size: 30px; line-height: 1.2; color: var(--silk);
    margin: 0 auto 8px;
    text-wrap: balance;
    max-width: 720px;
  }
  .page-intro__title em { font-style: italic; color: var(--brass-lit); }
  .page-intro__sub {
    font-size: 14px; color: var(--silk-muted);
    max-width: 560px; margin: 0 auto;
  }
  /* Room caption whispered under the intro when a direction is picked */
  .caption {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 20px;
    background: rgba(20, 12, 14, 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(232, 184, 73, 0.28);
    border-radius: 8px;
    text-align: center;
    opacity: 0;
    transition: opacity 500ms var(--ease);
    pointer-events: none;
  }
  .caption.on { opacity: 1; }
  .caption__label {
    font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--brass-lit);
  }
  .caption__line {
    font-family: var(--f-display); font-style: italic;
    font-size: 13.5px; color: var(--silk-muted);
    margin-top: 3px;
  }

  .products {
    position: relative; z-index: 2;
    max-width: 1360px; margin: 0 auto;
    padding: 32px 32px 100px;
  }
  .products__grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 44px;    /* wide gap → house visible between cards */
  }

  /* ================================================================
     PALM-LEAF CARDS — parchment tiles floating over the house
     ================================================================ */
  .card {
    position: relative;
    border: 1px solid rgba(58, 36, 24, 0.55);
    border-radius: 10px;
    overflow: hidden;
    display: flex; flex-direction: column;
    cursor: pointer;
    transition: all 340ms var(--ease);
    box-shadow:
      0 16px 36px -16px rgba(0, 0, 0, 0.9),
      0 4px 12px -4px rgba(0, 0, 0, 0.5);
  }
  .card:hover {
    transform: translateY(-4px) rotate(-0.2deg);
    box-shadow:
      0 26px 44px -14px rgba(0, 0, 0, 0.95),
      0 8px 18px -6px rgba(0, 0, 0, 0.7);
    border-color: rgba(139, 90, 46, 0.7);
  }
  .card.blessed {
    transform: translateY(-4px);
    box-shadow:
      0 0 44px -4px var(--blessed-glow, rgba(232, 184, 73, 0.75)),
      0 22px 42px -14px rgba(0, 0, 0, 0.95);
    border-color: var(--blessed-border, #B47C36);
  }
  .card.dimmed { opacity: 0.5; filter: saturate(0.7); }

  .card__image {
    position: relative;
    height: 260px;
    background:
      radial-gradient(58% 60% at 50% 40%, rgba(232, 184, 73, 0.14) 0%, rgba(232, 184, 73, 0) 70%),
      linear-gradient(180deg, #2E1C16 0%, #1F1310 100%);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid rgba(232, 184, 73, 0.28);
  }
  .card__image svg { width: 120px; height: 120px; }
  .card__image svg .fig {
    fill: rgba(252, 212, 111, 0.14);
    stroke: rgba(252, 212, 111, 0.92);
    stroke-width: 1;
  }
  .card__wish {
    position: absolute; top: 12px; right: 12px;
    width: 34px; height: 34px; padding: 0;
    background: rgba(15, 8, 8, 0.72);
    border: 1px solid rgba(232, 184, 73, 0.35);
    border-radius: 50%;
    color: rgba(232, 184, 73, 0.75);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 240ms var(--ease);
  }
  .card__wish:hover { color: var(--brass-lit); border-color: var(--brass-lit); }
  .card__wish.on {
    color: var(--sindoor); border-color: var(--sindoor);
    background: rgba(198, 32, 42, 0.20);
  }
  .card__wish svg { width: 16px; height: 16px; fill: currentColor; }
  .card__badge {
    position: absolute; top: 12px; left: 12px;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 4px;
    background: rgba(232, 184, 73, 0.2);
    color: var(--brass-lit);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(232, 184, 73, 0.35);
  }

  .card__body {
    position: relative;
    padding: 20px 22px 22px;
    background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
    color: var(--ink);
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 200px;
  }
  .card__body::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.6' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.28 0 0 0 0 0.15 0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.14;
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .card__body > * { position: relative; z-index: 1; }
  .card__deity {
    font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #A0631E;
    margin-bottom: 6px;
  }
  .card__name {
    font-family: var(--f-display); font-style: italic;
    font-size: 20px; line-height: 1.2; color: var(--ink);
    margin-bottom: 8px;
  }
  .card__meta {
    font-size: 12.5px; color: var(--ink-med);
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .card__hint {
    font-family: var(--f-display); font-style: italic;
    font-size: 12.5px; color: var(--ink-mut);
    margin-bottom: 16px;
    flex: 1;
  }
  .card__foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid rgba(58, 36, 24, 0.28);
  }
  .card__price {
    font-family: var(--f-display); font-size: 22px; color: var(--ink);
    font-weight: 500;
  }
  .card__cart {
    font-size: 11.5px; letter-spacing: 0.05em;
    padding: 9px 16px; border-radius: 5px;
    background: transparent;
    color: var(--ink);
    border: 1px solid #A0631E;
    cursor: pointer;
    font-family: var(--f-body);
    transition: all 260ms var(--ease);
  }
  .card__cart:hover {
    background: var(--ink);
    color: var(--parchment);
    border-color: var(--ink);
  }
  .card.in-cart .card__cart {
    color: var(--ink-mut);
    border-color: rgba(58, 36, 24, 0.28);
    background: rgba(58, 36, 24, 0.08);
  }
  .card.in-cart .card__cart::before { content: "✓ "; color: #A0631E; }

  @media (max-width: 900px) {
    .products__grid { grid-template-columns: repeat(2, 1fr); gap: 32px; }
    .sa-nav { display: none; }
  }
  @media (max-width: 600px) {
    .products__grid { grid-template-columns: 1fr; }
    .house-stage { height: 80vh; }
  }
</style>

<!-- ================================================================
     HOUSE — position: fixed, always alive behind everything
     ================================================================ -->
<div class="house-fixed">
  <div class="house-fixed__grain"></div>
  <div class="house-stage">
    <div class="house" id="house">
      <svg viewBox="0 0 900 540" preserveAspectRatio="xMidYMid meet">
        <defs>
          <pattern id="wood" width="30" height="30" patternUnits="userSpaceOnUse">
            <rect width="30" height="30" fill="#3E241A"/>
            <line x1="0" y1="6"  x2="30" y2="6"  stroke="#5A3624" stroke-width="0.4"/>
            <line x1="0" y1="14" x2="30" y2="14" stroke="#2A140A" stroke-width="0.4"/>
            <line x1="0" y1="22" x2="30" y2="22" stroke="#5A3624" stroke-width="0.4"/>
          </pattern>
          <pattern id="plaster" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#4A2B24"/>
            <circle cx="4" cy="6" r="0.5" fill="#5A3324" opacity="0.4"/>
            <circle cx="14" cy="12" r="0.4" fill="#3A1E18" opacity="0.5"/>
            <circle cx="8" cy="16" r="0.3" fill="#5A3324" opacity="0.3"/>
          </pattern>
          <radialGradient id="sky">
            <stop offset="0%" stop-color="#F0BC80"/>
            <stop offset="40%" stop-color="#B48070"/>
            <stop offset="100%" stop-color="#40384C"/>
          </radialGradient>
        </defs>
        <rect x="0" y="0" width="900" height="540" fill="url(#plaster)"/>
        <rect x="0" y="440" width="900" height="100" fill="url(#wood)"/>

        <g class="room-group" data-zone="NW">
          <rect class="rm-wall" x="0" y="0" width="300" height="180"/>
          <!-- Label at top -->
          <text class="rm-label" x="150" y="15">NW · GUEST ROOM</text>
          <!-- Window (left) with warm daylight -->
          <rect x="25" y="30" width="70" height="70" fill="#12080A" stroke="#7A4A2A" stroke-width="1.5"/>
          <rect x="28" y="33" width="64" height="64" fill="url(#sky)" opacity="0.55"/>
          <line x1="60" y1="30" x2="60" y2="100" stroke="#7A4A2A" stroke-width="0.8"/>
          <line x1="25" y1="65" x2="95" y2="65" stroke="#7A4A2A" stroke-width="0.8"/>
          <!-- Warm curtain on right side of window only -->
          <path class="curtain-r" d="M95 24 L 108 24 L 108 108 Q 104 106, 99 108 L 96 110 Q 95 106, 95 100 Z" fill="rgba(178,74,60,0.75)"/>
          <path d="M100 40 L 100 100" stroke="rgba(120,40,30,0.5)" stroke-width="0.4"/>
          <!-- Simple guest bed — proper single-bed proportions -->
          <!-- Bed frame base -->
          <rect x="128" y="122" width="156" height="34" fill="#5A3624" stroke="rgba(0,0,0,0.6)" stroke-width="0.6"/>
          <!-- Headboard (taller, obvious) -->
          <rect x="128" y="82" width="20" height="74" fill="#6E4326" stroke="rgba(0,0,0,0.6)" stroke-width="0.6"/>
          <rect x="132" y="94" width="12" height="52" fill="none" stroke="rgba(232,184,73,0.35)" stroke-width="0.4"/>
          <!-- Mattress on top of frame -->
          <rect x="148" y="118" width="136" height="14" fill="rgba(220,200,175,0.92)" stroke="rgba(160,140,110,0.5)" stroke-width="0.3"/>
          <!-- Cream pillow at head -->
          <rect x="152" y="105" width="30" height="16" rx="3" fill="rgba(240,225,195,0.95)" stroke="rgba(150,120,90,0.5)" stroke-width="0.4"/>
          <!-- Quilt draped over foot -->
          <path d="M225 118 L 285 118 L 285 156 L 275 158 L 265 156 L 255 158 L 245 156 L 235 158 L 225 156 Z" fill="rgba(178,74,60,0.85)" stroke="rgba(100,40,30,0.5)" stroke-width="0.4"/>
          <path d="M228 128 L 282 128 M 228 138 L 282 138 M 228 148 L 282 148" stroke="rgba(240,210,150,0.35)" stroke-width="0.3"/>
          <!-- Nightstand with brass lamp -->
          <rect x="108" y="130" width="18" height="28" fill="#3E241A" stroke="rgba(0,0,0,0.5)" stroke-width="0.4"/>
          <line x1="108" y1="146" x2="126" y2="146" stroke="rgba(232,184,73,0.35)" stroke-width="0.3"/>
          <!-- Lamp on nightstand -->
          <line x1="117" y1="130" x2="117" y2="120" stroke="var(--brass)" stroke-width="1"/>
          <path d="M111 120 L 123 120 L 121 112 L 113 112 Z" fill="var(--brass)"/>
          <ellipse cx="117" cy="129" rx="6" ry="1.4" fill="var(--brass)"/>
          <!-- Wooden floor at bottom -->
          <rect x="0" y="170" width="300" height="10" fill="rgba(74,44,26,0.7)"/>
          <rect class="rm-highlight" x="0" y="0" width="300" height="180" style="--room-glow: rgba(200, 220, 240, 0.14);"/>
          <rect class="rm-dim" x="0" y="0" width="300" height="180"/>
        </g>

        <g class="room-group" data-zone="N">
          <rect class="rm-wall" x="300" y="0" width="300" height="180"/>
          <text class="rm-label" x="450" y="15">N · MASTER BEDROOM</text>

    om: `<svg viewBox="0 0 40 40"><g class="fig" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="28" height="32" rx="2"/><rect x="9" y="7" width="22" height="26" fill="rgba(252,212,111,0.05)"/><text x="20" y="26" font-size="20" text-anchor="middle" fill="currentColor" font-family="serif" stroke="none">ॐ</text><line x1="9" y1="30" x2="31" y2="30"/></g></svg>`,
    chime: `<svg viewBox="0 0 40 40"><g class="fig" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="6" rx="10" ry="1.5"/><path d="M11 6 L 11 10 M 29 6 L 29 10"/><line x1="14" y1="10" x2="14" y2="26"/><line x1="18" y1="10" x2="18" y2="30"/><line x1="22" y1="10" x2="22" y2="30"/><line x1="26" y1="10" x2="26" y2="26"/><circle cx="14" cy="28" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="32" r="1.4" fill="currentColor" stroke="none"/><circle cx="22" cy="32" r="1.4" fill="currentColor" stroke="none"/><circle cx="26" cy="28" r="1.4" fill="currentColor" stroke="none"/></g></svg>`,
    pyramid: `<svg viewBox="0 0 40 40"><g class="fig" stroke-linecap="round" stroke-linejoin="round"><polygon points="20,4 6,32 34,32" fill="rgba(252,212,111,0.12)"/><line x1="20" y1="4" x2="20" y2="32"/><line x1="6" y1="32" x2="34" y2="32"/><line x1="14" y1="18" x2="26" y2="18"/><line x1="10" y1="25" x2="30" y2="25"/></g></svg>`
  };
  const house = document.getElementById("house");
  const chips = document.getElementById("chips");
  const grid  = document.getElementById("grid");
  const caption = document.getElementById("caption");
  const capL = document.getElementById("captionLabel");
  const capLn = document.getElementById("captionLine");
  const wishCount = document.getElementById("wishCount");
  const cartCount = document.getElementById("cartCount");
  const pieceCount = document.getElementById("pieceCount");
  const state = { activeZone: null, wishlist: new Set(), cart: new Set() };
  PRODUCTS.forEach(p => {
    const el = document.createElement("div");
    el.className = "card"; el.dataset.zone = p.zone; el.dataset.id = p.id;
    el.innerHTML = `
      <div class="card__image">
        <span class="card__badge">${p.zone} · ${p.deity.split(" · ")[0]}</span>
        <button class="card__wish" data-id="${p.id}" aria-label="Wishlist">
          <svg viewBox="0 0 24 24"><path d="M12 21 C 8 17, 4 13.5, 4 9 A 4 4 0 0 1 12 6 A 4 4 0 0 1 20 9 C 20 13.5, 16 17, 12 21 Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        </button>
        ${svgs[p.svg]}
      </div>
      <div class="card__body">
        <div class="card__deity">${p.deity}</div>
        <div class="card__name">${p.name}</div>
        <div class="card__meta">${p.meta}</div>
        <div class="card__hint">${p.hint}</div>
        <div class="card__foot">
          <div class="card__price">${p.price}</div>
          <button class="card__cart" data-id="${p.id}">Add to altar</button>
        </div>
      </div>`;
    grid.appendChild(el);
  });
  function setActive(zone) {
    state.activeZone = zone;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", (c.dataset.zone || null) === (zone || null)));
    if (zone && DIRECTIONS[zone]) {
      house.style.transformOrigin = DIRECTIONS[zone].origin;
      house.style.transform = "scale(1.5)";
      document.body.classList.add("active");
      document.querySelectorAll(".room-group").forEach(g => g.classList.toggle("active-room", g.dataset.zone === zone));
      capL.textContent = `${zone} · ${DIRECTIONS[zone].name}`;
      capLn.textContent = `“${DIRECTIONS[zone].room}”`;
      caption.classList.add("on");
    } else {
      house.style.transform = "scale(1)";
      house.style.transformOrigin = "50% 50%";
      document.body.classList.remove("active");
      document.querySelectorAll(".room-group").forEach(g => g.classList.remove("active-room"));
      caption.classList.remove("on");
    }
    let count = 0;
    document.querySelectorAll(".card").forEach(card => {
      const cardZone = card.dataset.zone;
      const blessed = zone && cardZone === zone;
      const dimmed  = zone && cardZone !== zone;
      card.classList.toggle("blessed", blessed);
      card.classList.toggle("dimmed",  dimmed);
      if (!zone || blessed) count++;
    });
    pieceCount.textContent = String(count);
  }
  function toggleWish(id) {
    if (state.wishlist.has(id)) state.wishlist.delete(id); else state.wishlist.add(id);
    document.querySelector(`.card__wish[data-id="${id}"]`).classList.toggle("on", state.wishlist.has(id));
    wishCount.textContent = String(state.wishlist.size);
  }
  function addToCart(id) {
    if (state.cart.has(id)) return;
    state.cart.add(id);
    document.querySelector(`.card[data-id="${id}"]`).classList.add("in-cart");
    cartCount.textContent = String(state.cart.size);
  }
  chips.addEventListener("click", e => { const t = e.target.closest(".chip"); if (t) setActive(t.dataset.zone || null); });
  grid.addEventListener("click", e => {
    const w = e.target.closest(".card__wish"); if (w) { toggleWish(w.dataset.id); e.stopPropagation(); return; }
    const c = e.target.closest(".card__cart"); if (c) { addToCart(c.dataset.id); e.stopPropagation(); return; }
  });
  setActive(null);
</script>
